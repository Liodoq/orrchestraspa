server: 
   port: 8080
spring: 
   datasource: 
      # Changed localhost to mysqldb to match your docker-compose service name
      url: jdbc:mysql://mysqldb:3306/spadb?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false
      username: root
      password: admin1234
      driver-class-name: com.mysql.cj.jdbc.Driver
   jpa: 
      show-sql: true
      properties: 
         hibernate: 
            # Updated to a more modern dialect for MySQL 8.0
            dialect: org.hibernate.dialect.MySQL8Dialect
      hibernate: 
         naming: 
            implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
            physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
         ddl-auto: update
logging:
   level: 
      com: 
         gabriel: 
            # Make sure this matches your package name (emplms)
            emplms: TRACE